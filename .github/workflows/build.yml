name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK already installed and
      # its licenses pre-accepted; the Gradle plugin downloads whatever
      # extra platform/build-tools version it needs on its own.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build (debug + release non firmata)
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      # Senza -Prete: le classi che chiamano YouTube Music e Spotify
      # davvero vengono saltate (vedi Rete.kt nei test). Dipendono da un
      # servizio che non controlliamo e da un catalogo che cambia da un
      # paese all'altro, quindi qui direbbero rosso per motivi che non
      # riguardano il codice.
      - name: Test
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
